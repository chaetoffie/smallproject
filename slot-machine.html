<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* --- ACCESS OVERLAY --- */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .machine-container {
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            text-align: center;
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title {
            color: #00ff00;
            font-size: 1.5em;
            text-shadow: 2px 2px 0px #006600;
            margin-bottom: 40px;
            animation: blink 2s infinite;
            letter-spacing: 2px;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.7; }
        }

        .slot-window {
            background: linear-gradient(180deg, #8b0000 0%, #5a0000 50%, #3a0000 100%);
            border: 8px solid #d4af37;
            border-radius: 0;
            padding: 60px 40px 40px 40px;
            margin: 20px 0;
            box-shadow: 
                inset 0 0 0 4px #8b4513,
                inset 0 0 0 8px #d4af37,
                0 8px 0 #000,
                0 12px 20px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .slot-window::before {
            content: '$$$ JACKPOT $$$';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 0.6em;
            text-shadow: 1px 1px 0px #000;
            letter-spacing: 2px;
        }

        .reels-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            background: #000;
            padding: 20px;
            border: 6px solid #1a1a1a;
            box-shadow: 
                inset 0 0 30px rgba(0, 255, 0, 0.2),
                inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .reel {
            position: relative;
            width: 80px;
            height: 240px;
            border: 4px solid #003300;
            border-radius: 0;
            overflow: hidden;
            background: #001100;
            box-shadow: 
                inset 0 0 20px rgba(0, 255, 0, 0.3),
                0 0 10px rgba(0, 255, 0, 0.2);
        }

        .reel-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-position: 0 0;
            background-repeat: repeat-y;
            transition: none;
        }

        .reel::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(
                rgba(0, 0, 0, 0.6) 0%, 
                transparent 30%, 
                transparent 70%, 
                rgba(0, 0, 0, 0.6) 100%
            );
            pointer-events: none;
        }

        .reel-symbol {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #00ff00;
            text-shadow: 
                0 0 5px #00ff00,
                0 0 10px #00ff00,
                2px 2px 0px #006600;
        }

        .spin-button {
            background: linear-gradient(180deg, #ff3333 0%, #cc0000 50%, #990000 100%);
            color: #ffffff;
            font-size: 0.7em;
            padding: 15px 30px;
            border: 6px solid #000000;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 0 #660000;
            transition: all 0.1s;
            margin-top: 60px;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
        }

        .spin-button:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #660000;
        }

        .spin-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .message {
            color: #00ff00;
            font-size: 0.6em;
            margin-top: 30px;
            min-height: 30px;
            text-shadow: 0 0 5px #00ff00;
        }

        .jackpot-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(180deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            padding: 40px 60px;
            border: 12px solid #000000;
            z-index: 1000;
            text-align: center;
        }

        .jackpot-banner.show {
            animation: jackpotAppear 0.3s forwards, shake 0.5s 0.3s infinite;
        }

        @keyframes jackpotAppear { to { transform: translate(-50%, -50%) scale(1); } }
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-2deg); }
            75% { transform: translate(-50%, -50%) rotate(2deg); }
        }

        .heart, .coin {
            position: fixed;
            font-size: 3em;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }

    </style>
</head>
<body>

    <div id="overlay">
        <div style="color: #00ff00; margin-bottom: 20px; font-size: 0.8em;">SYSTEM STATUS: ENCRYPTED</div>
        <button id="accessBtn" class="spin-button" style="width: 280px; height: 80px; border-radius: 10px;">ACCESS CASINO</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="Casino.mp3" type="audio/mpeg">
    </audio>
    <audio id="winMusic">
        <source src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" type="audio/mpeg">
    </audio>

    <div class="machine-container">
        <div class="title">Slot Machine</div>
        
        <div class="slot-window">
            <div class="reels-container">
                <div class="reel" id="reel1"><div class="reel-inner"></div></div>
                <div class="reel" id="reel2"><div class="reel-inner"></div></div>
                <div class="reel" id="reel3"><div class="reel-inner"></div></div>
            </div>
        </div>

        <button class="spin-button" id="spinBtn">SPIN</button>
        <div class="message" id="message"></div>
    </div>

    <div class="jackpot-banner" id="jackpotBanner">
        <div style="color: #ff0000; font-size: 1.5em; margin-bottom: 20px;">JACKPOT!</div>
        <div style="color: #000; font-size: 0.8em;">Will You Be<br>My Valentine?</div>
    </div>

    <script>
        const iconMap = ["A♠", "K♥", "Q♦", "J♣", "10♠", "9♥", "8♦", "7♣", "A♥"];
        const icon_height = 80;
        const num_icons = 9;
        const time_per_icon = 100;
        
        let indexes = [0, 0, 0];
        let spinCount = 0;
        let canSpin = true;

        const spinBtn = document.getElementById('spinBtn');
        const message = document.getElementById('message');
        const jackpotBanner = document.getElementById('jackpotBanner');
        const bgMusic = document.getElementById('bgMusic');
        const winMusic = document.getElementById('winMusic');
        const accessBtn = document.getElementById('accessBtn');
        const overlay = document.getElementById('overlay');

        // Handle Entrance and Background Music
        accessBtn.addEventListener('click', () => {
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.style.display = "none";
                bgMusic.volume = 0.4;
                bgMusic.play();
            }, 500);
        });

        const riggedOutcomes = [
            [2, 5, 7],  // Lose
            [1, 1, 3],  // Close
            [1, 1, 1]   // Jackpot
        ];

        function initReels() {
            const reels = document.querySelectorAll('.reel');
            reels.forEach((reel) => {
                const inner = reel.querySelector('.reel-inner');
                let symbols = '';
                for (let repeat = 0; repeat < 3; repeat++) {
                    for (let i = 0; i < num_icons; i++) {
                        symbols += `<div class="reel-symbol">${iconMap[i]}</div>`;
                    }
                }
                inner.innerHTML = symbols;
                inner.style.top = '0px';
            });
        }

        const rollReel = (reel, offset = 0, targetIndex = null) => {
            return new Promise((resolve) => {
                const inner = reel.querySelector('.reel-inner');
                const style = getComputedStyle(inner);
                const currentTop = parseFloat(style.top || 0);
                
                let delta;
                if (targetIndex !== null) {
                    const currentIndex = indexes[offset];
                    delta = (targetIndex - currentIndex + num_icons) % num_icons;
                    delta += (offset + 2) * num_icons;
                } else {
                    delta = (offset + 2) * num_icons + Math.round(Math.random() * num_icons);
                }
                
                const targetTop = currentTop - (delta * icon_height);
                const normTargetTop = targetTop % (num_icons * icon_height);
                
                setTimeout(() => {
                    inner.style.transition = `top ${(8 + 1 * delta) * time_per_icon}ms cubic-bezier(.41,-0.01,.63,1.09)`;
                    inner.style.top = `${targetTop}px`;
                }, offset * 150);
                
                setTimeout(() => {
                    inner.style.transition = 'none';
                    inner.style.top = `${normTargetTop}px`;
                    resolve(delta % num_icons);
                }, (8 + 1 * delta) * time_per_icon + offset * 150);
            });
        };

        async function rollAll() {
            if (!canSpin || spinCount >= 3) return;
            
            canSpin = false;
            spinBtn.disabled = true;
            message.textContent = 'Spinning...';
            
            const reelsList = document.querySelectorAll('.reel');
            const targetOutcome = riggedOutcomes[spinCount];
            
            const deltas = await Promise.all(
                [...reelsList].map((reel, i) => rollReel(reel, i, targetOutcome[i]))
            );
            
            deltas.forEach((delta, i) => {
                indexes[i] = (indexes[i] + delta) % num_icons;
            });
            
            spinCount++;
            
            if (spinCount === 1) {
                message.textContent = 'Try Again!';
                setTimeout(() => { canSpin = true; spinBtn.disabled = false; }, 500);
            } else if (spinCount === 2) {
                message.textContent = 'So Close!';
                setTimeout(() => { canSpin = true; spinBtn.disabled = false; }, 500);
            } else if (spinCount === 3) {
                message.textContent = 'JACKPOT!!!';
                setTimeout(() => { celebrate(); }, 500);
            }
        }

        function celebrate() {
            // Victory Music Switch
            bgMusic.pause();
            winMusic.play();

            jackpotBanner.classList.add('show');
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createFallingItem(Math.random() < 0.5 ? '♥️' : '💰');
                }, i * 100);
            }
        }

        function createFallingItem(symbol) {
            const item = document.createElement('div');
            item.className = symbol === '♥️' ? 'heart' : 'coin';
            item.textContent = symbol;
            item.style.left = Math.random() * 100 + 'vw';
            item.style.top = '-50px';
            item.style.animationDuration = (2 + Math.random() * 2) + 's';
            document.body.appendChild(item);
            setTimeout(() => { item.remove(); }, 4000);
        }

        initReels();
        spinBtn.addEventListener('click', rollAll);
    </script>
</body>
</html>
